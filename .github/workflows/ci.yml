name: FraudStream CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up Java for local Spark tests
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Dependencies
      run: python -m pip install -e ".[dev]"

    - name: Run Unit and Spark Transformation Tests
      run: python -m pytest tests/ -v

    - name: Verify Python Sources
      run: |
        python -m compileall -q simulator src notebooks pipelines tests
        python - <<'PY'
        from pathlib import Path
        for path in Path("notebooks").glob("*.py"):
            first_line = path.read_text(encoding="utf-8").splitlines()[0]
            assert first_line == "# Databricks notebook source", f"Missing notebook marker: {path}"
        PY

    - name: Run Simulator Dry-Run Smoke Test
      run: python -m simulator.main --dry-run --rate 100 --max-events 200
