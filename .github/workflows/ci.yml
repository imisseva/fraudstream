name: FraudStream CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio

    - name: Run Unit Tests
      run: |
        pytest tests/ -v

    - name: Verify Python Notebooks Syntax
      run: |
        python -m py_compile notebooks/00_run_all_pipeline.py
        python -m py_compile notebooks/01_fraudstream_ingestion.py
        python -m py_compile notebooks/02_fraudstream_silver_quality.py
        python -m py_compile notebooks/03_fraudstream_gold_detection.py
        python -m py_compile notebooks/04_fraud_dashboard_analytics.py

    - name: Run Simulator Dry-Run Smoke Test
      run: |
        python -m simulator.main --dry-run --rate 100 --max-events 200

