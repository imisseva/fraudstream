[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudstream"
version = "0.1.0"
description = "Kafka-based financial fraud streaming simulator and Databricks pipeline"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.6.1",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pyspark>=3.5.1,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fraudstream*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
