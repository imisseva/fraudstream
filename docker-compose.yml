# ==============================================================================
# FraudStream Simulator Container (Cloud Kafka Mode)
# Kết nối trực tiếp tới Aiven Kafka Cloud thông qua cấu hình trong .env
#   Khởi động: docker compose up -d
#   Xem logs:  docker compose logs -f
#   Dừng lại:  docker compose down
# ==============================================================================

services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudstream-simulator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_CA_PATH: /run/secrets/aiven-ca.pem
    volumes:
      - ./ca.pem:/run/secrets/aiven-ca.pem:ro
